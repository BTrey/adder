[project]
name = "adder"
version = "0.1.0"
description = "A running-tape calculator and notepad for the terminal"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "textual>=8.2.8",
]

[project.scripts]
adder = "adder.main:main"

[build-system]
requires = ["uv_build>=0.11.27,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pylint>=4.0.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.report]
# __main__.py runs only in a subprocess test, so its lines never reach this process.
omit = ["src/adder/__main__.py"]

[tool.mypy]
strict = true
exclude = ["\\.venv"]

[tool.pylint.main]
ignore-paths = ["\\.venv"]
init-hook = "import sys; sys.path.insert(0, 'src')"

[tool.pylint.format]
max-line-length = 100

[tool.pylint."messages control"]
# useless-return: mypy --strict needs an explicit `return None`.
disable = ["too-few-public-methods", "useless-return"]
